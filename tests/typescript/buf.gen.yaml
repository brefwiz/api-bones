# SPDX-License-Identifier: MIT
version: v2
plugins:
  - local: ./node_modules/.bin/protoc-gen-es
    out: generated
    include_imports: true
    opt:
      - target=js+dts
      - import_extension=js
inputs:
  - directory: ../..
    paths:
      - ../../tests/shared/proto/contract/v1/fields.proto
      - ../../api-bones-protos/proto/bones/sdk/v1/boundary.proto
