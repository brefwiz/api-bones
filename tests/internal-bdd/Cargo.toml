# SPDX-License-Identifier: MIT
#
# BDD proof for provider code no declared SDK surface reaches (SPEC.md
# `internal_behavior_owners`). One crate per corpus root so its single-language
# feature directory never merges with the dual-language `../rust` lane's.
[package]
name = "api-bones-internal-bdd"
version = "0.0.0"
edition = "2024"
publish = false
# Unpublished; declared so workspace members all resolve one.
license = "MIT"

[dependencies]
api-bones = { path = "../..", features = ["connect"] }
connectrpc = { version = "0.9.1", features = ["client"] }
bytes = "1"
http = "1.4.2"
api-bones-protos = { path = "../../api-bones-protos" }
api-bones-sdk = { path = "../../api-bones-sdk" }
api-bones-sdk-ffi = { path = "../../api-bones-sdk-ffi" }
api-bones-transport = { path = "../../api-bones-transport" }
api-bones-i18n = { path = "../../api-bones-i18n" }
api-bones-automation = { path = "../../api-bones-automation" }
prost-reflect = "0.16"
protox = "0.9"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
cucumber = "0.23"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[[test]]
name = "connect_client_headers"
harness = false

[[test]]
name = "pagination_max_limit"
harness = false

[[test]]
name = "connect_if_match_precondition"
harness = false

[[test]]
name = "connect_domain_error_code"
harness = false

[[test]]
name = "connect_code"
harness = false

[[test]]
name = "connect_get_reads"
harness = false

[[test]]
name = "error_type_mode"
harness = false

[[test]]
name = "proto_vocabulary"
harness = false

[[test]]
name = "sdk_wrapper_package"
harness = false

[[test]]
name = "automation_manifest"
harness = false

[[test]]
name = "sdk_wasm_integrity"
harness = false

[[test]]
name = "sdk_ffi_layer"
harness = false
