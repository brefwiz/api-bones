# SPDX-License-Identifier: LicenseRef-Brefwiz-Proprietary
#
# The Rust step lane for the shared Gherkin contract at ../features. One lane
# per language sits beside the corpus; the TypeScript lane is in
# api-bones-connect-ts.
[package]
name = "api-bones-contract-rust"
version = "0.0.0"
edition = "2024"
publish = false
# Unpublished; depends on proprietary brefwiz-cucumber-steps.
license = "LicenseRef-Brefwiz-Proprietary"

[dependencies]
api-bones-connect = { path = "../../api-bones-connect" }
api-bones-protos = { path = "../../api-bones-protos" }
prost-reflect = "0.16"
protox = "0.9"
connectrpc = "0.9.1"
http = "1.4.2"
bytes = "1"
http-body-util = "0.1"

[dev-dependencies]
cucumber = "0.23"
# The platform BDD runner.
brefwiz-cucumber-steps = { version = "0.4.26", registry = "brefwiz" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rcgen = "0.13"
hyper = { version = "1", features = ["http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[[test]]
name = "connect_retry_eligibility"
harness = false

[[test]]
name = "connect_precondition"
harness = false

[[test]]
name = "connect_error_info"
harness = false

[[test]]
name = "connect_csrf_replay_rule"
harness = false

[[test]]
name = "connect_pinned_peer"
harness = false

[[test]]
name = "field_labels"
harness = false
