//
// A service shaped as the platform's batch RPCs declare it: a single Get and
// its BatchGet, a paged List and its grouped BatchList. The Rust lane serves
// it over the wire from multi-organization data and calls it through the
// batch runtime.

syntax = "proto3";

package contract.v1;

import "bones/v1/annotations.proto";
import "bones/v1/batch.proto";
import "bones/v1/pagination.proto";

message Widget {
  string id = 1;
  string name = 2;
  // Echo of the request's `kind`, so a caller sees which request was answered.
  string kind = 3;
}

message GetWidgetRequest {
  string id = 1;
  string kind = 2;
}

message BatchGetWidgetsRequest {
  repeated string ids = 1;
  string kind = 2;
}

message WidgetResult {
  string id = 1;
  oneof outcome {
    Widget item = 2;
    bones.v1.ItemError error = 3;
  }
}

message BatchGetWidgetsResponse {
  repeated WidgetResult results = 1;
}

message ListWidgetPartsRequest {
  string widget_id = 1;
  bones.v1.PageRequest page = 2;
}

message ListWidgetPartsResponse {
  repeated string items = 1;
  bones.v1.PageResponse page = 2;
}

message UpdateWidgetPartsRequest {
  string widget_id = 1;
  repeated string items = 2;
  optional string owner = 3;
}

message BatchListWidgetPartsRequest {
  repeated string widget_ids = 1;
  bones.v1.PageRequest page = 2;
}

message WidgetPartsGroup {
  string widget_id = 1;
  repeated string items = 2;
  bones.v1.PageResponse page = 3;
  bones.v1.ItemError error = 4;
}

message BatchListWidgetPartsResponse {
  repeated WidgetPartsGroup groups = 1;
}

service Widgets {
  rpc GetWidget(GetWidgetRequest) returns (Widget) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // At most 200 ids per call.
  rpc BatchGetWidgets(BatchGetWidgetsRequest) returns (BatchGetWidgetsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (bones.v1.batch_of) = "GetWidget";
  }

  rpc ListWidgetParts(ListWidgetPartsRequest) returns (ListWidgetPartsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListWidgetPartsIdempotent(ListWidgetPartsRequest) returns (ListWidgetPartsResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  rpc ListWidgetPartsUnspecified(ListWidgetPartsRequest) returns (ListWidgetPartsResponse);

  rpc UpdateWidgetParts(UpdateWidgetPartsRequest) returns (ListWidgetPartsResponse);

  // At most 200 parents per call.
  rpc BatchListWidgetParts(BatchListWidgetPartsRequest) returns (BatchListWidgetPartsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (bones.v1.batch_of) = "ListWidgetParts";
  }
}

message WidgetPart {
  string key = 1;
  string label = 2;
}

message WidgetPartSet {
  repeated WidgetPart items = 1;
}

message PutWidgetPartRequest {
  string widget_id = 1;
  WidgetPart part = 2;
}

message CreateWidgetRequest {
  string name = 1;
  // At most 200 parts per call.
  repeated WidgetPart parts = 2 [(bones.v1.nested_write_of) = "PutWidgetPart"];
}

message UpdateWidgetRequest {
  string id = 1;
  // Unset leaves the stored parts unchanged; set, even empty, is the
  // complete set.
  optional WidgetPartSet parts = 2 [(bones.v1.nested_write_of) = "PutWidgetPart"];
}

// The widget and its stored parts.
message WidgetWithParts {
  Widget widget = 1;
  repeated WidgetPart parts = 2;
}

// A widget written together with its parts in one call.
service WidgetAssembly {
  rpc PutWidgetPart(PutWidgetPartRequest) returns (WidgetPart);

  rpc CreateWidget(CreateWidgetRequest) returns (WidgetWithParts);

  rpc UpdateWidget(UpdateWidgetRequest) returns (WidgetWithParts);
}
