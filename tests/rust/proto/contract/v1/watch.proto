//
// A response message shaped as the platform's streams declare it: the
// bones.v1.StreamControl field at 2047, outside any oneof. The Rust lane
// generates its Rust type at build time and declares it with
// `stream_controlled!`.

syntax = "proto3";

package contract.v1;

import "bones/v1/stream.proto";

message WatchEvent {
  oneof body {
    string id = 1;
  }

  bones.v1.StreamControl bones_control = 2047;
}

// A response message with no stream control field. The Rust lane holds it as
// the type of a consumer whose stream cannot open through the rotating client.
message PlainEvent {
  string id = 1;
}
