syntax = "proto3";
package contract.v1;
import "bones/v1/fields.proto";
import "bones/v1/annotations.proto";
import "bones/v1/errors.proto";

message ValidateFieldRequest {
  bones.v1.FieldDefinition definition = 1;
  bones.v1.TypedValue value = 2 [(bones.v1.typed_by) = "definition_id"];
  string definition_id = 3;
  bones.v1.FieldDefinition previous_definition = 4;
  // "definition", "value", or "change".
  string operation = 5;
}
message ValidateFieldResponse {
  repeated bones.v1.ValidationFailure violations = 1;
  string change = 2;
  bones.v1.FieldDefinition definition = 3;
  bones.v1.TypedValue value = 4 [(bones.v1.typed_by) = "definition_id"];
  string definition_id = 5;
}
service Fields {
  rpc Validate(ValidateFieldRequest) returns (ValidateFieldResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
