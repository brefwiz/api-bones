//
// A list service shaped as the platform's List RPCs declare it: a
// bones.v1.PageRequest in, one repeated field and a bones.v1.PageResponse out.
// The Rust lane serves it over the wire and iterates it with the generated
// client. One RPC per idempotency level a List RPC can declare.

syntax = "proto3";

package contract.v1;

import "bones/v1/pagination.proto";

message ListNoSideEffectsRequest {
  bones.v1.PageRequest page = 1;
}

message ListNoSideEffectsResponse {
  repeated uint32 items = 1;
  bones.v1.PageResponse page = 2;
}

message ListIdempotentRequest {
  bones.v1.PageRequest page = 1;
}

message ListIdempotentResponse {
  repeated uint32 items = 1;
  bones.v1.PageResponse page = 2;
}

message ListRequest {
  bones.v1.PageRequest page = 1;
}

message ListResponse {
  repeated uint32 items = 1;
  bones.v1.PageResponse page = 2;
}

service NumbersService {
  // Declared free of side effects.
  rpc ListNoSideEffects(ListNoSideEffectsRequest) returns (ListNoSideEffectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Declared idempotent.
  rpc ListIdempotent(ListIdempotentRequest) returns (ListIdempotentResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Declares no idempotency level.
  rpc List(ListRequest) returns (ListResponse);
}
