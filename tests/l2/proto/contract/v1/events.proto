// SPDX-License-Identifier: MIT
//
// A server-streaming service shaped as the platform's streams are: one request
// in, a stream of messages out. The call-helper lane serves it over the wire
// and reads it through the test service's Layer 2.

syntax = "proto3";

package contract.v1;

message WatchRequest {
  // How many ticks the server sends before it ends the stream.
  optional uint32 count = 1;
}

message Tick {
  uint32 sequence = 1;
}

// One streamed message: the tick it carries.
message WatchResponse {
  Tick tick = 1;
}

service EventsService {
  // Streams `count` ticks, numbered from zero.
  rpc Watch(WatchRequest) returns (stream WatchResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
