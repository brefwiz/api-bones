# SPDX-License-Identifier: MIT
[package]
name = "api-bones-sdk-ffi"
version = "0.1.0"
publish = ["brefwiz"]
edition = "2024"
rust-version = "1.85"
authors = ["Gregoire Salingue"]
license = "MIT"
description = "The native host boundary of the api-bones SDK for Kotlin and Swift: the host, handle and error types a uniffi binding exposes, built over the Layer 2 core."
repository = "https://github.com/brefwiz/api-bones"
homepage = "https://github.com/brefwiz/api-bones"
documentation = "https://docs.rs/api-bones-sdk-ffi"
keywords = ["sdk", "uniffi", "ffi"]
categories = ["api-bindings"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# The binding generator executable, off by default: it pulls the generator's
# command line and metadata readers.
bindgen-cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[dependencies]
api-bones = { version = "^25.0.0", path = "..", registry = "brefwiz", default-features = false, features = ["tls-webpki-roots"] }
api-bones-batch = { version = "0.11.0", path = "../api-bones-batch", registry = "brefwiz" }
api-bones-i18n = { version = "^0.2.0", path = "../api-bones-i18n", registry = "brefwiz" }
api-bones-page = { version = "0.11.0", path = "../api-bones-page", registry = "brefwiz" }
api-bones-rt = { version = "0.1.0", path = "../api-bones-rt", registry = "brefwiz" }
api-bones-sdk = { version = "0.6.0", path = "../api-bones-sdk", registry = "brefwiz" }
api-bones-transport = { version = "0.6.0", path = "../api-bones-transport", registry = "brefwiz" }
connectrpc = { version = "0.9.1", default-features = false }
http = "1.4.2"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
uniffi = { version = "0.31", features = ["tokio"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
