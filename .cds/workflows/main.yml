# CI for api-bones, whose canonical home is Gitea (GitHub is a downstream
# mirror). Mirrors the Gitea-primary library shape used by sqlx-switchboard:
# canonical checks, the Rust gates, and the crate-publish preflights.
#
# api-bones also ships three npm packages, so there is a TypeScript lane the
# Rust-only template has no equivalent for. It runs through ts-command.py with
# an explicit deadline: package-manager work must not be able to wedge a runner,
# and the canonical npm wrapper's budget is sized for installs rather than for
# building and testing three packages.

name: api-bones-ci

vars: [brefwiz-secrets, brefwiz-vars]

on:
  push:
    branches:
      - "**"
      # main is not this workflow's: it only ever fast-forwards to an rc
      # commit this workflow proved, and CDS reports every run of a workflow under
      # one context, so a run there would write it over rc's verdict.
      - '!main'

jobs:
  rc-tree-proof:
    # The CTO's ruling: identical tree to the merged PR head, that head's own
    # required checks already green -- rc's own run of this workflow proves
    # nothing a PR run has not already proven, so every other job below skips.
    # Runs (and can only prove anything) on a push to rc; a PR run leaves it
    # unproven, so nothing else here is ever gated on a PR run.
    if: ${{ git.ref_name == 'rc' || startsWith(git.ref, 'refs/heads/release-plz-') }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: checks
      memory: "4096"
      memory-request: 128Mi
      cpu-request: 300m
    outputs:
      proven:
        value: ${{ steps.check.outputs.proven }}
    steps:
      - id: checkout
        uses: actions/checkout
        with:
          depth: 0
      - id: check
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/rc-tree-proof@main
        with:
          checkout: "false"
          gitea-token: ${{ vars.brefwiz-secrets.FORGEJO_BOT_TOKEN }}
          event-ref: ${{ git.ref }}

  checks:
    if: ${{ git.ref_name != 'rc' || jobs.rc-tree-proof.outputs.proven != 'true' }}
    needs: [rc-tree-proof]
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: checks
      memory: "4096"
    env:
      CARGO_REGISTRIES_BREFWIZ_TOKEN: ${{ vars.brefwiz-secrets.CARGO_REGISTRIES_BREFWIZ_READER_TOKEN }}
      GITEA_TOKEN: ${{ vars.brefwiz-secrets.FORGEJO_BOT_TOKEN }}
    steps:
      - id: checkout
        uses: actions/checkout
      - id: checks
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/checks@main
        with:
          checkout: "false"
          # Both are required and neither can be inherited. Without `repository`
          # the runner cannot resolve which repo it is and aborts before it
          # reports anything; without the token, adr-conformance reads
          # brefwiz-architecture's catalog unauthenticated and gets a 404. A
          # composite takes inputs, not the job's ambient env.
          repository: ${{ cds.workflow_repository }}
          gitea-token: ${{ vars.brefwiz-secrets.FORGEJO_BOT_TOKEN }}

  cargo-package:
    needs: [rc-tree-proof, checks]
    if: ${{ (!startsWith(cds.event.ref, 'refs/heads/next-release/')) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') || jobs.rc-tree-proof.outputs.proven != 'true') }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: default
      memory: "16384"
    env:
      CARGO_REGISTRIES_BREFWIZ_TOKEN: ${{ vars.brefwiz-secrets.CARGO_REGISTRIES_BREFWIZ_TOKEN }}
      REGISTRY_USER: ${{ vars.brefwiz-secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ vars.brefwiz-secrets.REGISTRY_TOKEN }}
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
      GH_PACKAGES_READ_TOKEN: ${{ vars.brefwiz-secrets.GH_PACKAGES_READ_TOKEN }}
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: ${{ vars.brefwiz-vars.SCCACHE_REDIS }}
      CARGO_INCREMENTAL: "0"
      CI_CACHE_S3_URL: ${{ vars.brefwiz-vars.CI_CACHE_S3_URL }}
      CI_CACHE_KEY_ID: ${{ vars.brefwiz-secrets.CI_CACHE_KEY_ID }}
      CI_CACHE_KEY_SECRET: ${{ vars.brefwiz-secrets.CI_CACHE_KEY_SECRET }}
    steps:
      - id: checkout
        uses: actions/checkout
      - id: cargo-package
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/cargo-package@main
        with:
          checkout: "false"
          patch-workspace-deps: "true"
      # Shares this worker with the packaging proof above: both compile the
      # workspace, so a separate job would reserve a second one to rebuild it.
      - id: lib-crate-publish-gate
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/lib-crate-publish-gate@main
        with:
          checkout: "false"
      # And with clippy: cargo-package and clippy held the same DAG position
      # (same worker class, same `if`, no needs, no dependents) -- a bare
      # concurrency split that bought nothing a phase would not.
      - id: clippy
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/clippy@main
        with:
          checkout: "false"
  test:
    needs: [rc-tree-proof, checks]
    if: ${{ (!startsWith(cds.event.ref, 'refs/heads/next-release/')) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') || jobs.rc-tree-proof.outputs.proven != 'true') }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: ram-build
      memory: "24576"
    env:
      CARGO_REGISTRIES_BREFWIZ_TOKEN: ${{ vars.brefwiz-secrets.CARGO_REGISTRIES_BREFWIZ_TOKEN }}
      REGISTRY_USER: ${{ vars.brefwiz-secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ vars.brefwiz-secrets.REGISTRY_TOKEN }}
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
      GH_PACKAGES_READ_TOKEN: ${{ vars.brefwiz-secrets.GH_PACKAGES_READ_TOKEN }}
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: ${{ vars.brefwiz-vars.SCCACHE_REDIS }}
      CARGO_INCREMENTAL: "0"
      CI_CACHE_S3_URL: ${{ vars.brefwiz-vars.CI_CACHE_S3_URL }}
      CI_CACHE_KEY_ID: ${{ vars.brefwiz-secrets.CI_CACHE_KEY_ID }}
      CI_CACHE_KEY_SECRET: ${{ vars.brefwiz-secrets.CI_CACHE_KEY_SECRET }}
    steps:
      - id: checkout
        uses: actions/checkout
      - id: test
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/test@main
        with:
          checkout: "false"
      # Emitted from the job that already compiled the workspace rather than
      # paying for a second compile purely to feed the analysis.
      - id: rustdoc-json
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/rustdoc-json-emit@main
        with:
          artifact-name: rustdoc-json


  ts:
    needs: [rc-tree-proof, checks]
    if: ${{ (!startsWith(cds.event.ref, 'refs/heads/next-release/')) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') || jobs.rc-tree-proof.outputs.proven != 'true') }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: default
      memory: "16384"
    env:
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
      GH_PACKAGES_READ_TOKEN: ${{ vars.brefwiz-secrets.GH_PACKAGES_READ_TOKEN }}
    steps:
      - id: checkout
        uses: actions/checkout
      - id: npm-auth
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/npm-auth@main
        with:
          checkout: "false"
          npm-token: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
          registry-url: ${{ vars.brefwiz-vars.NPM_CONFIG_REGISTRY }}
      # api-bones-connect-ts takes its client identity from
      # @brefwiz/spiffe-client, which lives on the Gitea registry. npm-auth
      # appends to ~/.npmrc and the last @brefwiz:registry line wins, so this
      # must come after the step above — that one points the scope at
      # NPM_CONFIG_REGISTRY, which is the public registry and has no such
      # package.
      - id: configure-brefwiz-registry
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/npm-auth@main
        with:
          checkout: "false"
          npm-token: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
          registry-url: "https://git.brefwiz.com/api/packages/brefwiz/npm/"
      - id: ts
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          python3 /opt/ci-workflows/ci-scripts/ts-command.py \
            --kind build --timeout-seconds 1800 --log-file /tmp/ci-ts.log \
            -- make ci-ts
      # Emitted here rather than in the analysing job because the producer asks
      # the type checker which classes satisfy a port, so it needs the resolved
      # program this job just built. Run before the install and half the imports
      # resolve to `any`, which satisfies no port — the artifact stays
      # structurally valid while describing a program with no seams in it.
      - id: typerel-typescript
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/typerel-typescript-emit@main
        with:
          artifact-name: typerel-typescript

  # Its own job because it is its own worker class: it compiles nothing and
  # reads type relations out of the JSON `test` and `ts` uploaded. Without it a
  # workspace gets no abstraction-linked duplication signal at all, and silence
  # reads exactly like a clean workspace.
  duplication-typed:
    if: ${{ (!startsWith(cds.event.ref, 'refs/heads/next-release/')) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') || jobs.rc-tree-proof.outputs.proven != 'true') }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: checks
      memory: "4096"
    needs: [test, ts]
    env:
      CARGO_REGISTRIES_BREFWIZ_TOKEN: ${{ vars.brefwiz-secrets.CARGO_REGISTRIES_BREFWIZ_READER_TOKEN }}
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
    steps:
      - id: checkout
        uses: actions/checkout
      - id: duplication-typed
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/duplication-typed@main
        with:
          checkout: "false"
          repository: ${{ cds.workflow_repository }}
          rustdoc-artifact: rustdoc-json
          # This repo ships three npm packages, so the tier has a TypeScript
          # surface to read. Omitted, it reports zero for a language it never
          # opened — and a zero meaning `read nothing` is byte-identical to one
          # meaning `read everything and found nothing`.
          typerel-artifact: typerel-typescript

  # The run's verdict, reporting only. DAG contract: it requires every other
  # job's result, failed and skipped ones included, and outputs the verdict
  # manifest artifact. It `needs` every job and runs under always() so a
  # failed predecessor does not stop it. Nothing needs it: it gates no job
  # and no promotion.
  verdict:
    needs: [test, ts, duplication-typed, cargo-package, checks, rc-tree-proof]
    if: ${{ (always()) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') || jobs.rc-tree-proof.outputs.proven != 'true') }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: checks
      memory: "4096"
    env:
      REGISTRY_USER: ${{ vars.brefwiz-secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ vars.brefwiz-secrets.REGISTRY_TOKEN }}
      CI_CDS_TOKEN: ${{ vars.brefwiz-secrets.CDS_RUN_READER_TOKEN }}
    steps:
      - id: verdict
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/verdict@main
        with:
          jobs: |
            rc-tree-proof||${{ needs.rc-tree-proof.result }}
            test|rc-tree-proof|${{ needs.test.result }}
            ts|rc-tree-proof|${{ needs.ts.result }}
            duplication-typed|test,ts|${{ needs.duplication-typed.result }}
            cargo-package|rc-tree-proof|${{ needs.cargo-package.result }}
            checks|rc-tree-proof|${{ needs.checks.result }}
