# CI for api-bones, whose canonical home is Gitea (GitHub is a downstream
# mirror). Mirrors the Gitea-primary library shape used by sqlx-switchboard:
# canonical checks, the Rust gates, and the crate-publish preflights.
#
# api-bones also ships three npm packages, so there is a TypeScript lane the
# Rust-only template has no equivalent for. It runs through ts-command.py with
# an explicit deadline: package-manager work must not be able to wedge a runner,
# and the canonical npm wrapper's budget is sized for installs rather than for
# building and testing three packages.

name: api-bones-ci

vars: [brefwiz-vars, brefwiz-pr-readonly]

on:
  push:
    branches:
      - "**"
      # main is not this workflow's: it only ever fast-forwards to an rc
      # commit this workflow proved, and CDS reports every run of a workflow under
      # one context, so a run there would write it over rc's verdict.
      - '!main'

jobs:
  rc-tree-proof:
    # The CTO's ruling: identical tree to the merged PR head, that head's own
    # required checks already green -- rc's own run of this workflow proves
    # nothing a PR run has not already proven, so every other job below skips.
    # Runs (and can only prove anything) on a push to rc; a PR run leaves it
    # unproven, so nothing else here is ever gated on a PR run.
    if: ${{ cds.event.ref == 'refs/heads/rc' }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: checks
      memory: "4096"
      memory-request: 128Mi
      cpu-request: 300m
    vars: [brefwiz-secrets]
    outputs:
      proven:
        value: ${{ steps.check.outputs.proven }}
      proven_jobs:
        value: ${{ steps.check.outputs.proven_jobs }}
    steps:
      - id: checkout
        uses: actions/checkout
        with:
          depth: 0
      - id: check
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/rc-tree-proof@main
        with:
          checkout: "false"
          gitea-token: ${{ vars.brefwiz-secrets.FORGEJO_BOT_TOKEN }}
          cds-token: ${{ vars.brefwiz-pr-readonly.CDS_RUN_READER_TOKEN }}
          event-ref: ${{ git.ref }}

  checks:
    if: ${{ git.ref_name != 'rc' || !contains(jobs.rc-tree-proof.outputs.proven_jobs, ',checks,') }}
    needs: [rc-tree-proof]
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: checks
      memory: "4096"
    vars: [brefwiz-pr-readonly, brefwiz-secrets]
    env:
      CARGO_REGISTRIES_BREFWIZ_TOKEN: ${{ vars.brefwiz-secrets.CARGO_REGISTRIES_BREFWIZ_READER_TOKEN }}
      REGISTRY_USER: ${{ vars.brefwiz-pr-readonly.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ vars.brefwiz-pr-readonly.REGISTRY_TOKEN }}
      GITEA_TOKEN: ${{ vars.brefwiz-secrets.FORGEJO_BOT_TOKEN }}
    steps:
      - id: checkout
        uses: actions/checkout
      - id: checks
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/checks@main
        with:
          checkout: "false"
          # Both are required and neither can be inherited. Without `repository`
          # the runner cannot resolve which repo it is and aborts before it
          # reports anything; without the token, adr-conformance reads
          # brefwiz-architecture's catalog unauthenticated and gets a 404. A
          # composite takes inputs, not the job's ambient env.
          repository: ${{ cds.workflow_repository }}
          gitea-token: ${{ vars.brefwiz-secrets.FORGEJO_BOT_TOKEN }}

  cargo-package:
    needs: [checks]
    if: ${{ (!startsWith(cds.event.ref, 'refs/heads/next-release/')) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') && !startsWith(git.ref, 'refs/heads/next-release/') && !startsWith(git.ref, 'refs/heads/auto-tag-release/') || !contains(jobs.rc-tree-proof.outputs.proven_jobs, ',cargo-package,')) }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: ram-build
      memory: "24576"
    vars: [brefwiz-secrets, brefwiz-vars]
    env:
      CARGO_REGISTRIES_BREFWIZ_TOKEN: ${{ vars.brefwiz-secrets.CARGO_REGISTRIES_BREFWIZ_TOKEN }}
      REGISTRY_USER: ${{ vars.brefwiz-secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ vars.brefwiz-secrets.REGISTRY_TOKEN }}
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: ${{ vars.brefwiz-vars.SCCACHE_REDIS }}
      CARGO_INCREMENTAL: "0"
      CI_CACHE_S3_URL: ${{ vars.brefwiz-vars.CI_CACHE_S3_URL }}
      CI_CACHE_KEY_ID: ${{ vars.brefwiz-secrets.CI_CACHE_KEY_ID }}
      CI_CACHE_KEY_SECRET: ${{ vars.brefwiz-secrets.CI_CACHE_KEY_SECRET }}
    steps:
      - id: checkout
        uses: actions/checkout
      # Every publishable crate ships in one release-plz run, so the unit is
      # packaged against itself rather than against the registry.
      - id: release-readiness
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/make-target@main
        with:
          checkout: "false"
          make-target: ci-release-readiness
      # Shares this worker with the packaging proof above: both compile the
      # workspace, so a separate job would reserve a second one to rebuild it.
      - id: lib-crate-publish-gate
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/lib-crate-publish-gate@main
        with:
          checkout: "false"
      # And with clippy: cargo-package and clippy held the same DAG position
      # (same worker class, same `if`, no needs, no dependents) -- a bare
      # concurrency split that bought nothing a phase would not.
      - id: clippy
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/clippy@main
        with:
          checkout: "false"
      - id: sccache-stats
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/sccache-stats@main
  # The instrumented build, archived once for the coverage job.
  # DAG contract: requirement = the instrumented test binaries, compiled off the
  # worker that runs them, and the workspace rustdoc JSON; outputs = the
  # coverage archive (target/coverage-nextest-archive.tar.zst) and the rustdoc
  # JSON artifact; consumers = coverage and duplication-typed; needs =
  # rc-tree-proof, checks. No services: it compiles and runs no test.
  # Reservation: 24576, the ram-build profile default (no usage record exists
  # yet).
  coverage-build:
    needs: [checks]
    if: ${{ (!startsWith(cds.event.ref, 'refs/heads/next-release/')) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') && !startsWith(git.ref, 'refs/heads/next-release/') && !startsWith(git.ref, 'refs/heads/auto-tag-release/') || !contains(jobs.rc-tree-proof.outputs.proven_jobs, ',coverage-build,')) }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: ram-build
      memory: "24576"
    vars: [brefwiz-pr-readonly, brefwiz-vars]
    env:
      CARGO_REGISTRIES_BREFWIZ_TOKEN: ${{ vars.brefwiz-pr-readonly.CARGO_REGISTRIES_BREFWIZ_TOKEN }}
      REGISTRY_USER: ${{ vars.brefwiz-pr-readonly.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ vars.brefwiz-pr-readonly.REGISTRY_TOKEN }}
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-pr-readonly.PACKAGE_READER_TOKEN }}
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: ${{ vars.brefwiz-vars.SCCACHE_REDIS }}
      CARGO_INCREMENTAL: "0"
      CI_CACHE_S3_URL: ${{ vars.brefwiz-vars.CI_CACHE_S3_URL }}
      CI_CACHE_KEY_ID: ${{ vars.brefwiz-pr-readonly.CI_CACHE_KEY_ID }}
      CI_CACHE_KEY_SECRET: ${{ vars.brefwiz-pr-readonly.CI_CACHE_KEY_SECRET }}
    steps:
      - id: checkout
        uses: actions/checkout
      - id: coverage-archive
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/coverage@main
        with:
          checkout: "false"
          make-target: ci-coverage-archive
      # Emitted from the job that already compiled the workspace rather than
      # paying for a second compile purely to feed the analysis.
      - id: rustdoc-json
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/rustdoc-json-emit@main
        with:
          artifact-name: rustdoc-json
      - id: sccache-stats
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/sccache-stats@main
      - id: upload-coverage-archive
        uses: actions/uploadArtifact
        with:
          path: "target/coverage-nextest-archive.tar.zst"

  # The Gherkin contracts and doctests nextest cannot carry (harness = false).
  # DAG contract: requirement = every cucumber lane and the stream doctests
  # pass; outputs = none, a gate judged by the verdict only; needs =
  # rc-tree-proof, checks. It executes against Postgres, so it runs on the
  # default profile with its service, and its cargo tests compile and run
  # natively on either architecture, so it opts into the arm64 node.
  # Reservation: 16384, the default profile's request.
  gate-e2e-rust:
    needs: [checks]
    if: ${{ (!startsWith(cds.event.ref, 'refs/heads/next-release/')) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') && !startsWith(git.ref, 'refs/heads/next-release/') && !startsWith(git.ref, 'refs/heads/auto-tag-release/') || !contains(jobs.rc-tree-proof.outputs.proven_jobs, ',gate-e2e-rust,')) }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: default
      memory: "16384"
    vars: [brefwiz-pr-readonly, brefwiz-vars]
    services:
      postgres:
        image: registry.brefwiz.com/brefwiz/ci-postgres:v0.3.85@sha256:b4fece4be264e5709d7d118d2cf6246cda06d0af4feca91c21c7d4dcb02e8ad2
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        readiness:
          command: "bash -c '</dev/tcp/postgres/5432'"
          interval: "2s"
          timeout: "5s"
          retries: 30
    env:
      CI_ALLOW_ARM64_NODE: "true"
      DATABASE_URL: "postgres://postgres@postgres:5432/postgres"
      SKIP_TESTCONTAINERS: "1"
      CARGO_REGISTRIES_BREFWIZ_TOKEN: ${{ vars.brefwiz-pr-readonly.CARGO_REGISTRIES_BREFWIZ_TOKEN }}
      REGISTRY_USER: ${{ vars.brefwiz-pr-readonly.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ vars.brefwiz-pr-readonly.REGISTRY_TOKEN }}
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-pr-readonly.PACKAGE_READER_TOKEN }}
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: ${{ vars.brefwiz-vars.SCCACHE_REDIS }}
      CARGO_INCREMENTAL: "0"
      CI_CACHE_S3_URL: ${{ vars.brefwiz-vars.CI_CACHE_S3_URL }}
      CI_CACHE_KEY_ID: ${{ vars.brefwiz-pr-readonly.CI_CACHE_KEY_ID }}
      CI_CACHE_KEY_SECRET: ${{ vars.brefwiz-pr-readonly.CI_CACHE_KEY_SECRET }}
    steps:
      - id: checkout
        uses: actions/checkout
      # make-target embeds no target-dir cache, so this job restores and saves
      # its own snapshot beside sccache.
      - id: rust-cache-restore
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/rust-cache-restore@main
        with:
          job-class: gate-e2e-rust
      - id: e2e-rust
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/make-target@main
        with:
          checkout: "false"
          make-target: ci-e2e-rust
      - id: sccache-stats
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/sccache-stats@main
      - id: rust-cache-save
        if: ${{ always() }}
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/rust-cache-save@main
        with:
          job-class: gate-e2e-rust

  ts:
    needs: [checks]
    if: ${{ (!startsWith(cds.event.ref, 'refs/heads/next-release/')) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') && !startsWith(git.ref, 'refs/heads/next-release/') && !startsWith(git.ref, 'refs/heads/auto-tag-release/') || !contains(jobs.rc-tree-proof.outputs.proven_jobs, ',ts,')) }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: default
      memory: "16384"
    vars: [brefwiz-secrets, brefwiz-vars]
    services:
      postgres:
        image: registry.brefwiz.com/brefwiz/ci-postgres:v0.3.85@sha256:b4fece4be264e5709d7d118d2cf6246cda06d0af4feca91c21c7d4dcb02e8ad2
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        readiness:
          command: "bash -c '</dev/tcp/postgres/5432'"
          interval: "2s"
          timeout: "5s"
          retries: 30
    env:
      DATABASE_URL: "postgres://postgres@postgres:5432/postgres"
      SKIP_TESTCONTAINERS: "1"
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
    steps:
      - id: checkout
        uses: actions/checkout
      - id: npm-auth
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/npm-auth@main
        with:
          checkout: "false"
          npm-token: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
          registry-url: ${{ vars.brefwiz-vars.NPM_CONFIG_REGISTRY }}
      # api-bones-connect-ts takes its client identity from
      # @brefwiz/spiffe-client, which lives on the Gitea registry. npm-auth
      # appends to ~/.npmrc and the last @brefwiz:registry line wins, so this
      # must come after the step above — that one points the scope at
      # NPM_CONFIG_REGISTRY, which is the public registry and has no such
      # package.
      - id: configure-brefwiz-registry
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/npm-auth@main
        with:
          checkout: "false"
          npm-token: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
          registry-url: "https://git.brefwiz.com/api/packages/brefwiz/npm/"
      - id: require-database
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          if ! timeout 5 bash -c '</dev/tcp/postgres/5432' 2>/dev/null; then
            echo "::error::ts: the postgres service this job declares is not reachable at postgres:5432." >&2
            exit 1
          fi
      - id: ts
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          python3 /opt/ci-workflows/ci-scripts/ts-command.py \
            --kind build --timeout-seconds 1800 --log-file /tmp/ci-ts.log \
            -- make ci-ts
      # Emitted here rather than in the analysing job because the producer asks
      # the type checker which classes satisfy a port, so it needs the resolved
      # program this job just built. Run before the install and half the imports
      # resolve to `any`, which satisfies no port — the artifact stays
      # structurally valid while describing a program with no seams in it.
      - id: typerel-typescript
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/typerel-typescript-emit@main
        with:
          artifact-name: typerel-typescript

  # The instrumented suite from coverage-build's archive, then the report that
  # grades it (the platform default line floor, from the shared recipe) and stages target/nextest/ci/junit.xml.
  # DAG contract: requirement = the nextest suite passes under llvm-cov and the
  # coverage line floor holds; outputs = none, a gate judged by the verdict only;
  # needs = coverage-build (the archive). No services: no nextest-run test
  # touches a database (only api-bones-contract-rust does, and it runs in
  # gate-e2e-rust), so the run is one job, not partitions.
  # Reservation: 24576, the ram-build profile default (no usage record exists
  # yet).
  coverage:
    needs: [coverage-build]
    if: ${{ (!startsWith(cds.event.ref, 'refs/heads/next-release/')) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') && !startsWith(git.ref, 'refs/heads/next-release/') && !startsWith(git.ref, 'refs/heads/auto-tag-release/') || !contains(jobs.rc-tree-proof.outputs.proven_jobs, ',coverage,')) }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: ram-build
      memory: "24576"
    vars: [brefwiz-pr-readonly, brefwiz-vars]
    env:
      CARGO_REGISTRIES_BREFWIZ_TOKEN: ${{ vars.brefwiz-pr-readonly.CARGO_REGISTRIES_BREFWIZ_TOKEN }}
      REGISTRY_USER: ${{ vars.brefwiz-pr-readonly.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ vars.brefwiz-pr-readonly.REGISTRY_TOKEN }}
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-pr-readonly.PACKAGE_READER_TOKEN }}
      RUSTC_WRAPPER: sccache
      SCCACHE_REDIS: ${{ vars.brefwiz-vars.SCCACHE_REDIS }}
      CARGO_INCREMENTAL: "0"
      CI_CACHE_S3_URL: ${{ vars.brefwiz-vars.CI_CACHE_S3_URL }}
      CI_CACHE_KEY_ID: ${{ vars.brefwiz-pr-readonly.CI_CACHE_KEY_ID }}
      CI_CACHE_KEY_SECRET: ${{ vars.brefwiz-pr-readonly.CI_CACHE_KEY_SECRET }}
      COVERAGE_PROFILE_FILES: target/coverage-profiles.tar.zst
    steps:
      - id: checkout
        uses: actions/checkout
      - id: download-coverage-archive
        uses: actions/downloadArtifact
        with:
          name: "coverage-nextest-archive.tar.zst"
          path: "target/"
      - id: coverage-report
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/coverage@main
        with:
          checkout: "false"
          make-target: ci-coverage-run ci-coverage-report
      - id: sccache-stats
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/sccache-stats@main

  # Its own job because it is its own worker class: it compiles nothing and
  # reads type relations out of the JSON `coverage-build` and `ts` uploaded. Without it a
  # workspace gets no abstraction-linked duplication signal at all, and silence
  # reads exactly like a clean workspace.
  duplication-typed:
    if: ${{ (!startsWith(cds.event.ref, 'refs/heads/next-release/')) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') && !startsWith(git.ref, 'refs/heads/next-release/') && !startsWith(git.ref, 'refs/heads/auto-tag-release/') || !contains(jobs.rc-tree-proof.outputs.proven_jobs, ',duplication-typed,')) }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: checks
      memory: "4096"
    vars: [brefwiz-secrets]
    needs: [coverage-build, ts]
    env:
      CARGO_REGISTRIES_BREFWIZ_TOKEN: ${{ vars.brefwiz-secrets.CARGO_REGISTRIES_BREFWIZ_READER_TOKEN }}
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
    steps:
      - id: checkout
        uses: actions/checkout
      - id: duplication-typed
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/duplication-typed@main
        with:
          checkout: "false"
          repository: ${{ cds.workflow_repository }}
          rustdoc-artifact: rustdoc-json
          # This repo ships three npm packages, so the tier has a TypeScript
          # surface to read. Omitted, it reports zero for a language it never
          # opened — and a zero meaning `read nothing` is byte-identical to one
          # meaning `read everything and found nothing`.
          typerel-artifact: typerel-typescript

  # The run's verdict, reporting only. DAG contract: it requires every other
  # job's result, failed and skipped ones included, and outputs the verdict
  # manifest artifact. It `needs` every job and runs under always() so a
  # failed predecessor does not stop it. Nothing needs it: it gates no job
  # and no promotion.
  verdict:
    needs: [rc-tree-proof, checks, cargo-package, coverage-build, gate-e2e-rust, ts, coverage, duplication-typed]
    if: ${{ (always()) && (git.ref_name != 'rc' && !startsWith(git.ref, 'refs/heads/release-plz-') && !startsWith(git.ref, 'refs/heads/next-release/') && !startsWith(git.ref, 'refs/heads/auto-tag-release/') || !contains(jobs.rc-tree-proof.outputs.proven_jobs, ',verdict,')) }}
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      flavor: checks
      memory: "4096"
    vars: [brefwiz-secrets]
    steps:
      - id: verdict
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/verdict@main
        with:
          registry-user: ${{ vars.brefwiz-pr-readonly.REGISTRY_USER }}
          registry-token: ${{ vars.brefwiz-pr-readonly.REGISTRY_TOKEN }}
          cds-token: ${{ vars.brefwiz-pr-readonly.CDS_RUN_READER_TOKEN }}
          jobs: |
            rc-tree-proof||${{ needs.rc-tree-proof.result }}
            checks|rc-tree-proof|${{ needs.checks.result }}
            cargo-package|checks|${{ needs.cargo-package.result }}
            coverage-build|checks|${{ needs.coverage-build.result }}
            gate-e2e-rust|checks|${{ needs.gate-e2e-rust.result }}
            ts|checks|${{ needs.ts.result }}
            coverage|coverage-build|${{ needs.coverage.result }}
            duplication-typed|coverage-build,ts|${{ needs.duplication-typed.result }}
