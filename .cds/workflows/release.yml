# Publishes @brefwiz/api-bones-connect on a connect-v* tag.
#
# This repo's canonical home is Gitea; GitHub is a downstream mirror. The
# package publishes to the brefwiz npm registry, which is what makes it
# resolvable to consumers whose @brefwiz scope points there — npm and pnpm
# select a registry per SCOPE rather than per package, so a dependency of a
# Gitea-published package that lives only on GitHub Packages cannot be resolved
# by those consumers at all, whatever credentials they hold.
#
# Two publish axes, both owned here now that the repo lives in Gitea:
#
#   Rust crates -> crates.io, via release-plz on every push to main. All eight
#   were publishable with no mechanism publishing them: a merged version bump
#   simply never shipped, and nothing reported it.
#
#   @brefwiz/api-bones-connect -> the brefwiz npm registry, on a connect-v* tag.
#
# release-plz runs both modes on every push and each is idempotent: release-pr
# opens/updates the standing bump PR, release publishes whatever an earlier
# merge already changed, and no-ops otherwise.

name: api-bones-release

vars: [brefwiz-secrets, brefwiz-vars]

on:
  push:
    branches:
      - main
    tags:
      - "connect-v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "connect tag to re-release (e.g. connect-v0.2.2)"
        required: true

jobs:
  release-plz-pr:
    if: ${{ git.ref_name == 'main' }}
    region: brefwiz-light
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci-light@main
      flavor: checks
      memory: "1536"
    steps:
      - id: checkout
        uses: actions/checkout
        with:
          fetch-depth: 0
      - id: release-plz
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/release-plz@main
        with:
          checkout: "false"
          mode: release-pr
          git-token: ${{ vars.brefwiz-secrets.RELEASE_BOT_TOKEN }}
          forge: gitea
          gpg-key-id: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_ID }}
          gpg-private-key-b64: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_B64 }}
          registry-token: ${{ vars.brefwiz-secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-release:
    if: ${{ git.ref_name == 'main' }}
    region: brefwiz-light
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci-light@main
      flavor: checks
      memory: "1536"
    steps:
      - id: checkout
        uses: actions/checkout
        with:
          fetch-depth: 0
      - id: release-plz
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/release-plz@main
        with:
          checkout: "false"
          mode: release
          git-token: ${{ vars.brefwiz-secrets.RELEASE_BOT_TOKEN }}
          forge: gitea
          gpg-key-id: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_ID }}
          gpg-private-key-b64: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_B64 }}
          registry-token: ${{ vars.brefwiz-secrets.CARGO_REGISTRY_TOKEN }}

  publish:
    if: ${{ startsWith(git.ref_name, 'connect-v') }}
    region: brefwiz-local
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci@main
      memory: "4096"
    env:
      PACKAGE_READER_TOKEN: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
      # CARGO_REGISTRIES_BREFWIZ_TOKEN is the one that carries npm package:write
      # on this registry; PACKAGE_PUBLISHER_TOKEN 401s there.
      NPM_TOKEN: ${{ vars.brefwiz-secrets.CARGO_REGISTRIES_BREFWIZ_TOKEN }}
      CI_LOGS_TOKEN: ${{ vars.brefwiz-secrets.CI_LOGS_TOKEN }}
    steps:
      - id: resolve
        env:
          TAG_INPUT: ${{ cds.workflow.inputs.tag }}
          REF_NAME_INPUT: ${{ git.ref_name }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          REF="${TAG_INPUT:-$REF_NAME_INPUT}"
          if [[ ! "$REF" =~ ^connect-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::resolve: tag '$REF' does not match 'connect-vX.Y.Z'"
            exit 1
          fi
          worker output "tag" "$REF"
          worker output "version" "${BASH_REMATCH[1]}"
      - id: checkout
        uses: actions/checkout
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0
      # A tag whose version disagrees with the manifest is a mis-mint, not a
      # release; publishing it would put a version on the registry that no
      # commit claims.
      - id: validate
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/validate-release-version@main
        with:
          checkout: "false"
          tag: ${{ steps.resolve.outputs.version }}
          version-file: api-bones-connect-ts/package.json
      - id: publish
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/npm-authenticated-make@main
        with:
          checkout: "false"
          make-target: ci-connect-ts-publish
          package-reader-token: ${{ vars.brefwiz-secrets.PACKAGE_READER_TOKEN }}
          npm-publish-token: ${{ vars.brefwiz-secrets.CARGO_REGISTRIES_BREFWIZ_TOKEN }}
          gh-packages-read-token: ${{ vars.brefwiz-secrets.GH_PACKAGES_READ_TOKEN }}
