# Publishes @brefwiz/api-bones-connect on a connect-v* tag.
#
# This repo's canonical home is Gitea; GitHub is a downstream mirror. The
# package publishes to the brefwiz npm registry, which is what makes it
# resolvable to consumers whose @brefwiz scope points there — npm and pnpm
# select a registry per SCOPE rather than per package, so a dependency of a
# Gitea-published package that lives only on GitHub Packages cannot be resolved
# by those consumers at all, whatever credentials they hold.
#
# Two publish axes, both owned here now that the repo lives in Gitea:
#
#   Rust crates -> crates.io, via release-plz on every push to main. All eight
#   were publishable with no mechanism publishing them: a merged version bump
#   simply never shipped, and nothing reported it.
#
# The npm surface is its own axis and lives in sdk-release.yml: a split release
# axis needs a dedicated workflow, not a second trigger bolted onto this one.
#
# release-plz runs both modes on every push and each is idempotent: release-pr
# opens/updates the standing bump PR, release publishes whatever an earlier
# merge already changed, and no-ops otherwise.

name: api-bones-release

vars: [brefwiz-secrets, brefwiz-vars]

on:
  push:
    branches:
      - main
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to re-release (e.g. 3.1.0)"
        required: true

jobs:
  # Reads the declared publish surface once, so the pipeline does not restate
  # inline what SPEC.md and the Makefile already say.
  publish-config:
    region: brefwiz-light
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci-light@main
      memory: "1536"
    steps:
      - id: checkout
        uses: actions/checkout
      - id: publish-config
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/publish-config@main
        with:
          checkout: "false"

  release-plz-pr:
    if: ${{ git.ref_name == 'main' }}
    region: brefwiz-light
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci-light@main
      flavor: checks
      memory: "1536"
    steps:
      - id: checkout
        uses: actions/checkout
        with:
          fetch-depth: 0
      - id: release-plz
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/release-plz@main
        with:
          checkout: "false"
          mode: release-pr
          git-token: ${{ vars.brefwiz-secrets.RELEASE_BOT_TOKEN }}
          forge: gitea
          gpg-key-id: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_ID }}
          gpg-private-key-b64: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_B64 }}
          registry-token: ${{ vars.brefwiz-secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-release:
    if: ${{ git.ref_name == 'main' }}
    region: brefwiz-light
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci-light@main
      flavor: checks
      memory: "1536"
    steps:
      - id: checkout
        uses: actions/checkout
        with:
          fetch-depth: 0
      - id: release-plz
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/release-plz@main
        with:
          checkout: "false"
          mode: release
          git-token: ${{ vars.brefwiz-secrets.RELEASE_BOT_TOKEN }}
          forge: gitea
          gpg-key-id: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_ID }}
          gpg-private-key-b64: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_B64 }}
          registry-token: ${{ vars.brefwiz-secrets.CARGO_REGISTRY_TOKEN }}

  # Mandatory on every release pipeline: a tag whose version disagrees with the
  # manifest is a mis-mint, and publishing it puts a version on the registry
  # that no commit claims.
  validate-version:
    if: ${{ startsWith(git.ref_name, '0') || startsWith(git.ref_name, '1') || startsWith(git.ref_name, '2') || startsWith(git.ref_name, '3') || startsWith(git.ref_name, '4') || startsWith(git.ref_name, '5') || startsWith(git.ref_name, '6') || startsWith(git.ref_name, '7') || startsWith(git.ref_name, '8') || startsWith(git.ref_name, '9') }}
    region: brefwiz-light
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci-light@main
      memory: "1536"
    env:
      CI_LOGS_TOKEN: ${{ vars.brefwiz-secrets.CI_LOGS_TOKEN }}
    steps:
      - id: checkout
        uses: actions/checkout
        with:
          ref: ${{ git.ref_name }}
          fetch-depth: 0
      - id: validate
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/validate-release-version@main
        with:
          checkout: "false"
          tag: ${{ git.ref_name }}

  # Mandatory audit trail: the release that shipped, recorded against the tag.
  gitea-release:
    needs: [validate-version]
    if: ${{ !failure() && !cancelled() }}
    region: brefwiz-light
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci-light@main
      memory: "1536"
    env:
      CI_LOGS_TOKEN: ${{ vars.brefwiz-secrets.CI_LOGS_TOKEN }}
    steps:
      - id: checkout
        uses: actions/checkout
        with:
          ref: ${{ git.ref_name }}
          fetch-depth: 0
      - id: gitea-release-create
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/gitea-release-create@main
        with:
          checkout: "false"
          tag: ${{ git.ref_name }}
          repo: brefwiz/api-bones
          token: ${{ vars.brefwiz-secrets.FORGEJO_BOT_TOKEN }}
          release-notes-extra: |
            ### Artifacts published
            - Rust crates (crates.io), published per-crate by release-plz.
            - npm packages release on their own axis — see sdk-release.yml.
