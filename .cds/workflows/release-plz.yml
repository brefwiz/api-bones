# The Rust crate release axis for api-bones: release-plz, on every push to main.
#
# It lives in its own workflow rather than inside release.yml because that is
# what identifies release-plz as this repo's typed crate-release owner. A
# library unit's release owner is recognised from the canonical workflow and the
# canonical composite together — a repo that buries release-plz among a tag
# pipeline's jobs reads as having no owner for the crates it publishes, which is
# indistinguishable from the state this repo was actually in: eight publishable
# crates, nothing publishing them, a merged version bump that simply never
# shipped and nothing reporting it.
#
# Both modes run on every push and each is idempotent: release-pr opens or
# updates the standing bump PR, release publishes whatever an earlier merge
# already changed, and otherwise no-ops.

name: api-bones-release-plz

vars: [brefwiz-secrets, brefwiz-vars]

on:
  push:
    branches:
      - main

jobs:
  release-plz-pr:
    region: brefwiz-light
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci-light@main
      flavor: checks
      memory: "1536"
    steps:
      - id: checkout
        uses: actions/checkout
        with:
          fetch-depth: 0
      - id: release-plz
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/release-plz@main
        with:
          checkout: "false"
          mode: release-pr
          git-token: ${{ vars.brefwiz-secrets.RELEASE_BOT_TOKEN }}
          forge: gitea
          gpg-key-id: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_ID }}
          gpg-private-key-b64: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_B64 }}
          registry-token: ${{ vars.brefwiz-secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-release:
    region: brefwiz-light
    runs-on:
      model: BREFWIZ/brefwiz/brefwiz/infra/brefwiz-ci-light@main
      flavor: checks
      memory: "1536"
    steps:
      - id: checkout
        uses: actions/checkout
        with:
          fetch-depth: 0
      - id: release-plz
        uses: BREFWIZ/brefwiz/brefwiz/ci-workflows/release-plz@main
        with:
          checkout: "false"
          mode: release
          git-token: ${{ vars.brefwiz-secrets.RELEASE_BOT_TOKEN }}
          forge: gitea
          gpg-key-id: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_ID }}
          gpg-private-key-b64: ${{ vars.brefwiz-secrets.RELEASE_BOT_GPG_KEY_B64 }}
          registry-token: ${{ vars.brefwiz-secrets.CARGO_REGISTRY_TOKEN }}
