# SPDX-License-Identifier: MIT
[package]
name = "api-bones-schema-gen"
version = "0.0.0"
edition = "2024"
authors = ["Gregoire Salingue"]
license = "MIT"
publish = false
description = "Internal: dumps the api-bones JSON Schema that @brefwiz/api-bones-types is generated from."

[dependencies]
api-bones = { version = "^19.0.1", path = "..", features = ["schemars", "uuid", "chrono", "serde", "std"] }
schemars = { version = "1", features = ["uuid1", "chrono04"] }
serde_json = "1"

[lints]
workspace = true
