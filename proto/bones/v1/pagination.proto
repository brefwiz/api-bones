// SPDX-License-Identifier: LicenseRef-Proprietary
//
// Canonical pagination shapes for brefwiz proto-source services
// (ADR-0085 + the api-bones canonical-shapes pattern).
//
// Cursor-based pagination is the proto-canonical default — scales to
// large / append-only datasets without per-page total counts. Mirrors
// the api-bones Rust `Cursor` opaque-token convention (URL-safe
// base64-no-pad).
//
// The companion `PageResponse.revision` doubles as the list-level
// ETag used by service-kit's envelope middleware (ADR-0085
// `envelope.v1.etag_field` on `ListXResponse`).
//
// For offset/limit pagination (admin UIs, small datasets), the Rust
// `api_bones::pagination::PaginatedResponse<T>` shape remains the
// utoipa-legacy choice. A canonical proto offset/limit pair will land
// here when a service genuinely needs it.

syntax = "proto3";

package bones.v1;

// Per-request pagination input — cursor + page size.
//
// Convention:
//   - `cursor` empty → start of collection.
//   - `page_size` 0  → server default (per-service).
//
// Services compose this into their list-request messages:
//
//   message ListFoosRequest {
//     bones.v1.PageRequest page = 1;
//     // ... service-specific filters
//   }
message PageRequest {
  // Opaque cursor returned by a previous PageResponse.next_cursor.
  // Empty string means start of collection.
  string cursor = 1;

  // Max items the server should return on this page.
  // 0 means use the server default.
  uint32 page_size = 2;
}

// Per-response pagination output — next-cursor + revision.
//
// Convention:
//   - `next_cursor` empty → no more pages.
//   - `revision` is the collection-level ETag for list-cache
//     validation. Clients pass it as `if-none-match` metadata on the
//     next request; unchanged → server may return 304-equivalent.
//
// Services compose this into their list-response messages:
//
//   message ListFoosResponse {
//     repeated Foo items = 1;
//     bones.v1.PageResponse page = 2;
//   }
message PageResponse {
  // Opaque cursor for the next page. Empty when no more pages.
  string next_cursor = 1;

  // Collection-level revision/ETag — increments on any mutation.
  // Used for list-level cache validation via if-none-match metadata.
  string revision = 2;
}
