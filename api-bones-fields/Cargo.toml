[package]
name = "api-bones-fields"
version = "0.2.6"
publish = ["brefwiz"]
edition = "2024"
license = "MIT"
description = "Pure validation of canonical typed field definitions and values"
repository = "https://github.com/brefwiz/api-bones"

[lints]
workspace = true

[dependencies]
