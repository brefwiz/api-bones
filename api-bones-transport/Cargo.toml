[package]
name = "api-bones-transport"
version = "0.1.0"
publish = ["brefwiz"]
edition = "2024"
rust-version = "1.85"
authors = ["Gregoire Salingue"]
license = "MIT"
description = "The one Connect client transport of the fleet: HTTP/2 only, one connection per peer, a request that never ran replayed once, connections driven by one process runtime. Independent of any api-bones major."
repository = "https://github.com/brefwiz/api-bones"
homepage = "https://github.com/brefwiz/api-bones"
documentation = "https://docs.rs/api-bones-transport"
readme = "README.md"
keywords = ["connectrpc", "http2", "transport", "client"]
categories = ["network-programming", "web-programming::http-client"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Depends on neither api-bones nor api-bones-connect: the transport type
# crosses crate boundaries (service-kit hands it to every SDK), so it must not
# move with an api-bones major.
[dependencies]
connectrpc = { version = "0.9.1", default-features = false, features = ["client", "client-tls"] }
# The request path is built on h2's client directly: hyper's client cannot say
# which requests it never wrote, and that is what the replay depends on.
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false }
http = "1.4.2"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rcgen = "0.13"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
