[package]
name = "api-bones-transport"
version = "0.6.0"
publish = ["brefwiz"]
edition = "2024"
rust-version = "1.85"
authors = ["Gregoire Salingue"]
license = "MIT"
description = "The one Connect client transport of the fleet: HTTP/2 only, one connection per peer, a request that never ran replayed once, connections driven by one process runtime. Independent of any api-bones major."
repository = "https://github.com/brefwiz/api-bones"
homepage = "https://github.com/brefwiz/api-bones"
documentation = "https://docs.rs/api-bones-transport"
readme = "README.md"
keywords = ["connectrpc", "http2", "transport", "client"]
categories = ["network-programming", "web-programming::http-client"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# `node-exchange` carries the Node host exchange and the workload identity
# policy it runs into wasm32 builds. The SDK core turns it on; the size probe
# toggles it to measure what it costs; it is off only for that size-probe
# floor. Any wasm package built without api-bones-sdk must turn it on.
# Native builds always have the policy.
[features]
node-exchange = []

# Depends on api-bones only for `Reach`, a plain enum with no dependencies
# (default features off), and not on api-bones-connect.
[dependencies]
api-bones = { version = "^25.0.0", path = "..", registry = "brefwiz", default-features = false, features = ["connect-core"] }
# The client core only. connectrpc's `client` and `client-tls` features start
# tokio tasks and read `std::time::Instant`, neither of which a browser has, so
# they are enabled for native targets alone (see below).
connectrpc = { version = "0.9.1", default-features = false }
api-bones-rt = { version = "0.1.0", path = "../api-bones-rt", registry = "brefwiz" }
http = "1.4.2"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
tracing = "0.1"
# Reads the URI SAN of a presented leaf; pure Rust, so it builds on wasm32.
x509-parser = { version = "0.16", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# A native build trusts a root store; a browser build has none.
api-bones = { version = "^25.0.0", path = "..", registry = "brefwiz", default-features = false, features = ["tls-webpki-roots"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["client", "client-tls"] }
# The request path is built on h2's client directly: hyper's client cannot say
# which requests it never wrote, and that is what the replay depends on.
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }

# The browser transport calls `globalThis.fetch`. `SendWrapper` meets
# connectrpc's `Send` bound on futures and bodies that hold JS values; browser
# wasm is one thread, which api-bones-rt enforces by refusing `atomics`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.105"
send_wrapper = { version = "0.6", features = ["futures"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = [
    "AbortController",
    "AbortSignal",
    "Headers",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "RequestCache",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "Response",
] }

# The wasm suite drives the client core the way a generated client does.
# `js-sys` and `wasm-bindgen-futures` come from the dependencies above.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
buffa = "0.9"
buffa-types = { version = "0.9", features = ["json"] }
wasm-bindgen-test = "0.3.78"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "test-util"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
h2 = "0.4"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rcgen = "0.13"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
