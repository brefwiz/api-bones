[package]
name = "api-bones-batch"
version = "0.8.5"
publish = ["brefwiz"]
edition = "2024"
rust-version = "1.85"
authors = ["Gregoire Salingue"]
license = "MIT"
description = "The SDK batch runtime: explicit batch calls with chunking and per-item results, and same-tick coalescing of single Gets, under a per-chunk identity guard."
repository = "https://github.com/brefwiz/api-bones"
homepage = "https://github.com/brefwiz/api-bones"
documentation = "https://docs.rs/api-bones-batch"
keywords = ["batch", "connectrpc", "sdk"]
categories = ["api-bindings"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
prost-reflect = { workspace = true }
api-bones-page = { version = "0.8.5", path = "../api-bones-page", registry = "brefwiz" }
api-bones-rt = { version = "0.1.0", path = "../api-bones-rt", registry = "brefwiz" }
api-bones-transport = { version = "0.3.2", path = "../api-bones-transport", registry = "brefwiz" }
buffa = "0.9"
api-bones = { version = "^22.4.0", path = "..", registry = "brefwiz", default-features = false, features = ["connect-core"] }
connectrpc = { version = "0.9.1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1.4.2"
sha2 = "0.11"
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
tracing = "0.1"

# A native build trusts a root store and enables connectrpc's own client; a
# browser build has neither, because `api_bones_transport::HttpTransport::fetch`
# calls the browser's `fetch`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
api-bones = { version = "^22.4.0", path = "..", registry = "brefwiz", default-features = false, features = ["tls-native-roots"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["client"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
api-bones-protos = { path = "../api-bones-protos", version = "^0.9.2", registry = "brefwiz" }
protox = "0.9"
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
buffa-types = { version = "0.9", features = ["json"] }
