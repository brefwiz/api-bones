// SPDX-License-Identifier: MIT
//
// The service surface the wasm-size probe (tools/wasm-size-probe) compiles into
// the browser module it measures. It is never served: the probe only links
// the generated clients, so a size is the cost of the client code and the
// capability runtime, not of any handler.
//
//   Probe1, Probe10, Probe50  services of 1, 10 and 50 unary methods; the
//                             slope between Probe10 and Probe50 is the cost
//                             of one more method.
//   Second                    one unary method on a second service.
//   Catalog                   the capability service: a keyset List, a Get
//                             with its BatchGet, and an unbounded server
//                             stream that can be rotated.

syntax = "proto3";

package bones.probe.v1;

import "bones/v1/annotations.proto";
import "bones/v1/batch.proto";
import "bones/v1/pagination.proto";
import "bones/v1/stream.proto";

message EchoRequest {
  string id = 1;
}

message EchoResponse {
  string id = 1;
  string value = 2;
}

message Item {
  string id = 1;
  string name = 2;
}

message ListItemsRequest {
  bones.v1.PageRequest page = 1;
  string filter = 2;
}

message ListItemsResponse {
  repeated Item items = 1;
  bones.v1.PageResponse page = 2;
}

message GetItemRequest {
  string id = 1;
  string org = 2;
}

message BatchGetItemsRequest {
  repeated string ids = 1;
  string org = 2;
}

message ItemResult {
  string id = 1;
  oneof outcome {
    Item item = 2;
    bones.v1.ItemError error = 3;
  }
}

message BatchGetItemsResponse {
  repeated ItemResult results = 1;
}

message WatchRequest {
  string filter = 1;
}

message WatchEvent {
  string id = 1;
  bones.v1.StreamControl bones_control = 2047;
}

service Catalog {
  rpc ListItems(ListItemsRequest) returns (ListItemsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc GetItem(GetItemRequest) returns (Item) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc BatchGetItems(BatchGetItemsRequest) returns (BatchGetItemsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (bones.v1.batch_of) = "GetItem";
  }

  rpc Watch(WatchRequest) returns (stream WatchEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (bones.v1.call_shape) = CALL_SHAPE_UNBOUNDED_STREAM;
  }
}

service Second {
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

