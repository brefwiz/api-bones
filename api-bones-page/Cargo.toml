[package]
name = "api-bones-page"
version = "0.8.0"
publish = ["brefwiz"]
edition = "2024"
rust-version = "1.85"
authors = ["Gregoire Salingue"]
license = "MIT"
description = "The SDK page iterator for keyset-paginated List RPCs: auto-follows next_cursor, prefetches one page, retries idempotent fetches only."
repository = "https://github.com/brefwiz/api-bones"
homepage = "https://github.com/brefwiz/api-bones"
documentation = "https://docs.rs/api-bones-page"
keywords = ["pagination", "connectrpc", "sdk"]
categories = ["api-bindings"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
api-bones = { version = "^22.0.0", path = "..", registry = "brefwiz", default-features = false, features = ["connect-core"] }
api-bones-rt = { version = "0.1.0", path = "../api-bones-rt", registry = "brefwiz" }
connectrpc = { version = "0.9.1", default-features = false }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror = "2"
tracing = { workspace = true }
sha2 = { workspace = true }

# A native build trusts a root store, as the `connect` feature always did; a
# browser build has none, because the browser owns the connection.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
api-bones = { version = "^22.0.0", path = "..", registry = "brefwiz", default-features = false, features = ["tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
