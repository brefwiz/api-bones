[package]
name = "api-bones-sdk-gen"
version = "5.2.1"
publish = ["brefwiz"]
edition = "2024"
authors = ["Gregoire Salingue"]
license = "MIT"
description = "CLI for generating Brefwiz Rust + TypeScript SDKs with default-on ApiResponse envelope handling"
repository = "https://github.com/brefwiz/api-bones"
readme = "README.md"

[[bin]]
name = "api-bones-sdk-gen"
path = "src/main.rs"

[dependencies]
api-bones-progenitor = { path = "../api-bones-progenitor", version = "^4.4.2", registry = "brefwiz" }
api-bones-sdk-model = { version = "0.2.0", path = "../api-bones-sdk-model", registry = "brefwiz" }
brotli = { version = "8", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
prost-reflect = { workspace = true }
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
anyhow = "1"
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
api-bones-protos = { path = "../api-bones-protos", version = "^0.9.2", registry = "brefwiz" }
protox = "0.9"
