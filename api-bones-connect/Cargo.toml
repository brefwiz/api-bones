[package]
name = "api-bones-connect"
version = "0.1.1"
edition = "2024"
authors = ["Gregoire Salingue"]
license = "MIT"
description = "Connect RPC adapter primitives for api-bones services (ADR-0096)"
repository = "https://github.com/brefwiz/api-bones"
homepage = "https://github.com/brefwiz/api-bones"
documentation = "https://docs.rs/api-bones-connect"
readme = "README.md"
keywords = ["connect", "grpc", "rpc", "protobuf", "api-bones"]
categories = ["web-programming::http-server", "api-bindings", "network-programming"]
rust-version = "1.85"
# Not publishable anywhere while it depends on brefwiz-spiffe-client.
# crates.io refuses a package whose dependencies are not themselves on
# crates.io, and the Brefwiz registry is no better: this crate's own
# `api-bones` dependency resolves from crates.io, which publish-preflight
# (ADR platform/0220) correctly refuses to mix.
#
# Nothing outside this repo consumes it as a published crate today, so saying
# so costs nothing. Delete this key once brefwiz-spiffe-client is published
# publicly and the crates.io default applies again.
publish = false

[dependencies]
api-bones = { version = "6", path = "..", default-features = false, features = ["connect"] }
connectrpc = { version = "0.9", optional = false }
brefwiz-spiffe-client = { version = "0.43", registry = "brefwiz" }
http = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lints]
workspace = true
