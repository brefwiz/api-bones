# release-plz owns per-crate versioning and publishing for this workspace.
#
# Before this, all eight crates were publishable with no release mechanism
# publishing them: a version bump merged to main never reached the registry,
# and nothing said so — release-single-owner calls that a silent no-publish.
#
# Every publishable Cargo.toml here declares `publish = ["brefwiz"]`. Absent,
# Cargo's default is crates.io, and the run reaches a publish with no
# credential that can write there — which is what left 6.13.0 merged, tagged
# in intent and never shipped. release-plz reads the target from Cargo
# directly, so it is not restated here (`registry` is not a valid key in this
# file); what this file owns is which crates release, not where they go.
[workspace]
release = true
