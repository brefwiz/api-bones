[package]
name = "api-bones-sdk-macros"
version = "0.4.1"
publish = ["brefwiz"]
edition = "2024"
rust-version = "1.85"
authors = ["Gregoire Salingue"]
license = "MIT"
description = "The attribute macros of the api-bones SDK: #[client], #[export] and #[error] turn a Layer 2 crate's annotated items into its Wire impls and its wasm exports."
repository = "https://github.com/brefwiz/api-bones"
homepage = "https://github.com/brefwiz/api-bones"
documentation = "https://docs.rs/api-bones-sdk-macros"
keywords = ["sdk", "macros", "wasm"]
categories = ["development-tools"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"
proc-macro = true

[dependencies]
api-bones-sdk-model = { version = "0.3.0", path = "../api-bones-sdk-model", registry = "brefwiz" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
api-bones-sdk = { version = "0.4.1", path = "../api-bones-sdk", registry = "brefwiz" }
trybuild = "1"
wasm-bindgen-macro-support = { workspace = true }
