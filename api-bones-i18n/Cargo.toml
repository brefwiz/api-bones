[package]
name = "api-bones-i18n"
version = "0.1.3"
publish = ["brefwiz"]
edition = "2024"
rust-version = "1.85"
authors = ["Gregoire Salingue"]
license = "MIT"
description = "Renders a refused call's typed error identity in the viewer's locale from the owner's catalog: key resolution, locale negotiation, bounded arguments and an ICU MessageFormat subset."
repository = "https://github.com/brefwiz/api-bones"
homepage = "https://github.com/brefwiz/api-bones"
documentation = "https://docs.rs/api-bones-i18n"
keywords = ["i18n", "errors", "localization", "icu"]
categories = ["internationalization"]

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
## The build helper that embeds and checks the catalogs of the emitters a
## compiled descriptor set declares (`emitters`). Build scripts enable it; a
## runtime dependent leaves it off and pulls in no proto crate.
descriptor = ["dep:api-bones-protos", "dep:prost-reflect"]

[dependencies]
api-bones-protos = { path = "../api-bones-protos", version = "^0.9.2", registry = "brefwiz", optional = true }
prost-reflect = { version = "0.16", optional = true }
icu_datetime = "2.4"
icu_decimal = { version = "2.4", features = ["alloc"] }
icu_locale = "2.4"
icu_plurals = "2.4"
icu_calendar = "2.4"
icu_time = "2.4"
fixed_decimal = { version = "0.7", features = ["ryu"] }
inventory = "0.3"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
protox = "0.9"
