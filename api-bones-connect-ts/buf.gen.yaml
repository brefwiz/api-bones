# SPDX-License-Identifier: MIT
version: v2
plugins:
  - local: ./node_modules/.bin/protoc-gen-es
    out: src/generated
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: ../api-bones-protos/proto
    paths:
      - ../api-bones-protos/proto/bones/v1/fields.proto
      - ../api-bones-protos/proto/bones/v1/annotations.proto
      - ../api-bones-protos/proto/bones/v1/errors.proto
      - ../api-bones-protos/proto/bones/v1/pagination.proto
