# SPDX-License-Identifier: MIT
#
# parity-units.yml — surfaces this library ships in more than one language.
#
# api-bones ships the same Connect vocabulary twice, once in Rust and once in
# TypeScript. Nothing used to hold the two together: `feature-closure` treats a
# library as proven when a public change ships an executable test case, and one
# language having one satisfies that. A normaliser added to the TypeScript half
# shipped with its own passing tests, cleared every gate, and left Rust behind.
#
# Each unit below names the paired modules, one corpus both languages answer,
# and the proof in each language that reads it. `library-parity` enforces that
# every public symbol is paired or exempted, and that each proof genuinely
# loads the corpus — a suite with its own hand-written cases shows the language
# works, not that the two agree.

units:
  - id: connect-retry-eligibility
    description: >-
      Which transport failures may be replayed, and how they are coded. The
      seven connection-write signatures are transcribed into each language by
      hand; the corpus carries one case per signature so the two lists cannot
      drift apart unnoticed.
    corpus: test-fixtures/parity/connect-retry-eligibility.json
    targets:
      rust:
        module: src/connect/retry_eligibility.rs
        proof: src/connect/retry_eligibility.rs
      typescript:
        module: api-bones-connect-ts/src/retry-eligibility.ts
        proof: api-bones-connect-ts/src/retry-eligibility.parity.test.ts
