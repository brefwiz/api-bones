# `cargo publish --dry-run` resolves each crate's dependencies against the
# registry, and a workspace member being published in the same run is not on it
# yet — the dry run would fail on a version that exists only in this tree.
# Redirect each publishable member to its local path so the dry run reads what
# is about to be published rather than what already shipped.
#
# api-bones-connect is absent on purpose: it declares `publish = false`, so
# nothing resolves it from the registry and an entry here would redirect a
# dependency that does not exist.
[patch.brefwiz]
api-bones = { path = "." }
api-bones-tower = { path = "api-bones-tower" }
api-bones-reqwest = { path = "api-bones-reqwest" }
api-bones-progenitor = { path = "api-bones-progenitor" }
api-bones-sdk-gen = { path = "api-bones-sdk-gen" }
api-bones-sdk = { path = "api-bones-sdk" }
api-bones-sdk-macros = { path = "api-bones-sdk-macros" }
api-bones-sdk-model = { path = "api-bones-sdk-model" }
api-bones-test = { path = "api-bones-test" }
api-bones-protos = { path = "api-bones-protos" }
api-bones-stream = { path = "api-bones-stream" }
api-bones-i18n = { path = "api-bones-i18n" }
api-bones-transport = { path = "api-bones-transport" }
api-bones-page = { path = "api-bones-page" }
api-bones-batch = { path = "api-bones-batch" }
api-bones-rt = { path = "api-bones-rt" }

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-size-s]
inherits = "wasm-size"
opt-level = "s"
