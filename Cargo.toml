[workspace]
members = [
    ".",
    "api-bones-connect",
    "api-bones-tower",
    "api-bones-reqwest",
    "api-bones-progenitor",
    "api-bones-sdk-gen",
    "api-bones-sdk",
    "api-bones-sdk-macros",
    "api-bones-sdk-model",
    "api-bones-test",
    "api-bones-protos",
    "api-bones-rt",
    "api-bones-stream",
    "api-bones-transport",
    "api-bones-page",
    "api-bones-batch",
    "api-bones-fields",
    "api-bones-automation",
    "api-bones-i18n",
    # Dumps the JSON Schema that @brefwiz/api-bones-types is generated from.
    "api-bones-types",
    # The Rust step lane for the shared Gherkin contract. A member rather than
    # an integration test of the crate it exercises, because the contract is
    # answered by two languages and each lane sits beside the corpus.
    "tests/rust",
    # The Rust step lane of the `sdk-call` surface: the lane is the directory
    # above the contract's `features` directory, so its own base keeps the
    # wrapper-driven TypeScript lane beside it apart from `tests/typescript`.
    "tests/sdk-call/rust",
    # BDD proof for provider code no declared SDK surface reaches (SPEC.md
    # `internal_behavior_owners`). A separate crate so its single-language
    # feature directory stays its own corpus root, distinct from the
    # dual-language one above.
    "tests/internal-bdd",
    # The native Connect server the wasm32 fetch transport suite runs against.
    "tests/wasm-server",
    # The api-bones test service's Rust Layer 2: annotated with the SDK
    # macros, built apart from tests/rust because it must build for wasm32.
    "tests/l2",
    "tools/wasm-size-probe",
]
resolver = "2"

[workspace.dependencies]
heck = "0.5"
prost-reflect = "0.16"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
testcontainers = "0.28"
tokio-postgres = "0.7"
ucum = { package = "ucum-units", version = "0.1" }
iso_currency = "0.7"
email_address = "0.2"
url = "2"
# The fleet holds one wasm-bindgen version, the one Cargo.lock records and the
# CI image's wasm-bindgen-cli is pinned at. Every crate that needs it inherits
# this entry; the range is a floor and the lockfile is the pin.
wasm-bindgen = ">=0.2.128"
# The expander behind `#[wasm_bindgen]`, so the macro tests run the real one.
wasm-bindgen-macro-support = ">=0.2.128"

[workspace.lints.rust]
warnings    = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[package]
name = "api-bones"
version = "20.0.0"
publish = ["brefwiz"]
edition = "2024"
authors = ["Gregoire Salingue"]
license = "MIT"
description = "Opinionated REST API types: errors (RFC 9457), pagination, health checks, and more"
repository = "https://github.com/brefwiz/api-bones"
homepage = "https://github.com/brefwiz/api-bones"
documentation = "https://docs.rs/api-bones"
readme = "README.md"
keywords = ["rest", "http", "rfc9457", "api", "axum"]
categories = ["web-programming::http-server", "api-bindings", "no-std", "data-structures"]
rust-version = "1.85"

[features]
default = ["std", "serde", "uuid", "chrono", "validator"]
## Enables `std`-dependent types (`HashMap`, `std::error::Error`, etc.).
## Disabling this switches the crate to `#![no_std]` mode; pair with `alloc`
## for heap-allocated types (`String`, `Vec`, `Arc`).
std = ["alloc", "thiserror/std"]
## Enables heap-allocated types (`String`, `Vec`, `Arc`) in `no_std` contexts.
alloc = []
serde = ["dep:serde", "dep:serde_json", "uuid?/serde", "chrono?/serde", "std"]
## Enables `serde::base64_bytes` — `Vec<u8>` ↔ Base64 string serde helpers.
## Requires `alloc`.
base64 = ["alloc", "dep:base64"]
uuid = ["dep:uuid"]
chrono = ["dep:chrono", "utoipa?/chrono"]
## Proto adapter primitives for Connect RPC services (ADR-0096).
## Provides chrono_to_timestamp, parse_uuid, build_page (OffsetPage), and
## ConnectOptionExt. Activates the uuid and chrono features as side-effects.
## Zero impact on consumers who do not declare this feature.
connect = ["tls-native-roots"]
## The Connect client surface without a TLS root source or the native client.
## On wasm32 enable it alone; elsewhere enable it only through `tls-native-roots`
## or `tls-webpki-roots`, because on its own it does not compile there.
connect-core = ["dep:api-bones-rt", "dep:api-bones-stream", "dep:connectrpc", "dep:tokio", "dep:buffa", "dep:buffa-types", "dep:tracing", "dep:serde", "dep:serde_json", "dep:base64", "dep:bytes", "dep:futures-core", "dep:http-body-util", "uuid", "chrono", "http", "std"]
## Trust the operating system root store (honours `SSL_CERT_FILE`/`SSL_CERT_DIR`).
## Takes precedence over `tls-webpki-roots` when both are enabled.
tls-native-roots = ["connect-core", "dep:rustls-native-certs", "connectrpc/client", "connectrpc/client-tls", "connectrpc/gzip", "connectrpc/zstd"]
## Trust the bundled Mozilla roots, or only the certificates named by
## `SSL_CERT_FILE`/`SSL_CERT_DIR` when either is set. Links no platform
## framework, so it cross-links from any host.
tls-webpki-roots = ["connect-core", "dep:webpki-roots", "dep:rustls-pki-types", "connectrpc/client", "connectrpc/client-tls", "connectrpc/gzip", "connectrpc/zstd"]
http = ["dep:http", "alloc"]
axum = ["dep:axum", "http", "serde", "std"]
utoipa = ["dep:utoipa", "std"]
icalendar = ["dep:icalendar", "std"]
validator = ["dep:validator", "std"]
arbitrary = ["dep:arbitrary", "uuid?/arbitrary", "std"]
proptest = ["dep:proptest", "dep:proptest-derive", "std"]
fake = ["dep:fake", "dep:rand", "std", "uuid"]
schemars = ["dep:schemars", "schemars/uuid1", "schemars/chrono04", "std"]
## Enables HMAC-SHA256 signing for opaque cursors (`Cursor::encode_signed` / `decode_signed`).
## Requires `base64` and `alloc`.
hmac = ["base64", "alloc", "dep:hmac", "dep:sha2"]
## Enables OpenTelemetry trace context propagation helpers for SDK clients.
## Provides `inject_current` for injecting the active span context into HTTP headers.
## Requires `http`, `std` (the `opentelemetry` crate is not no_std-compatible),
## and `opentelemetry` (SDK is only needed for tests).
opentelemetry = ["http", "std", "dep:opentelemetry"]
## Renders a refused call in the viewer's locale: `api_bones::i18n` re-exports
## `api-bones-i18n` and implements `Localizable` for the error types.
i18n = ["dep:api-bones-i18n", "serde", "std"]

[dependencies]
thiserror = { version = "2", default-features = false }
api-bones-rt = { version = "0.1.0", path = "api-bones-rt", registry = "brefwiz", optional = true }
api-bones-stream = { path = "api-bones-stream", version = "^0.1.4", registry = "brefwiz", optional = true }
api-bones-i18n = { path = "api-bones-i18n", version = "^0.1.2", registry = "brefwiz", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
uuid = { version = "1.23.3", features = ["v4"], optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std", "now", "serde"], optional = true }
arbitrary = { version = "1", features = ["derive"], optional = true }
proptest = { version = "1", optional = true }
proptest-derive = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
http = { version = "1.4.2", optional = true }
utoipa = { version = "5", optional = true, features = ["uuid", "chrono"] }
icalendar = { version = "0.17.11", features = ["parser", "serde"], optional = true }
validator = { version = "0.21", features = ["derive"], optional = true }
fake = { version = "5", optional = true }
rand = { version = "0.10", optional = true }
schemars = { version = "1", optional = true }
base64 = { version = "0.23", default-features = false, features = ["alloc"], optional = true }
bytes = { version = "1", optional = true }
futures-core = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
# connect feature — versions must match what buffa-types / generated proto code use.
# Mismatch causes type-laundering pain at adapter boundaries (ADR-0096).
connectrpc  = { version = "0.9.1", default-features = false, features = ["json"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }
buffa       = { version = "0.9", optional = true }
buffa-types = { version = "0.9", features = ["json"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1.0.10", optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
tracing     = { version = "0.1", optional = true }
opentelemetry = { version = "0.32", optional = true }

# The browser has no OS entropy source; uuid draws it from `crypto.getRandomValues`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.23.3", optional = true, features = ["js"] }

[lints.rust]
# Allow cfg(coverage) set by cargo-llvm-cov
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }
# PLATFORM-008: Zero-Tolerance Security Linting
unsafe_code = { level = "deny", priority = -1 }
unsafe_op_in_unsafe_fn = { level = "deny", priority = -1 }
warnings = { level = "deny", priority = -1 }
unused_imports = { level = "deny", priority = -1 }
unused_variables = { level = "deny", priority = -1 }
dead_code = { level = "deny", priority = -1 }

[lints.clippy]
# PLATFORM-008: Tier 3 — pedantic linting at deny level
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Selective allow-list (justified below)
missing_errors_doc = "allow"   # serde/helper fns — noise without benefit
missing_panics_doc = "allow"   # no panic paths in public API
module_name_repetitions = "allow"    # e.g. ErrorCode, ApiError — idiomatic
missing_const_for_fn = "allow"       # nursery: not stable across MSRV, adds no safety value here
derive_partial_eq_without_eq = "allow" # nursery: serde types are rarely fully Eq-hashable
option_if_let_else = "allow"         # nursery: map_or_else is less readable in match-heavy code
# ApiError is RFC-9457 problem details and runs ~200B by design. Boxing it to
# satisfy a perf lint on the error path would change every handler signature in
# the fleet and put an allocation on every rejection, to buy nothing at the call
# site. The lint fires only where a non-async fn returns it, which after the
# extractors stopped being needlessly async is every one of them.
# golden-lint: justified: boxing ApiError would change every handler signature in the fleet
result_large_err = "allow"
# golden-lint: justified: serde `with` helpers must take `&Option<T>`; the signature is fixed by serde
ref_option = "allow"
# golden-lint: justified: serde `default = "path"` must name a fn returning the field type `Option<u64>`
unnecessary_wraps = "allow"
# golden-lint: justified: `CacheControl` mirrors the independent boolean directives of the HTTP Cache-Control header
struct_excessive_bools = "allow"
# golden-lint: justified: builder methods take `impl ToString` so callers pass `&str`, numbers and bools alike
needless_pass_by_value = "allow"
# golden-lint: justified: JSON float timestamps are floored and rounded into i64 seconds and u32 nanoseconds
cast_possible_truncation = "allow"
# golden-lint: justified: proto Timestamp nanos are i32 and a chrono nanosecond count is below 2e9
cast_possible_wrap = "allow"
# golden-lint: justified: the rounded nanosecond fraction is non-negative by construction
cast_sign_loss = "allow"

[dev-dependencies]
api-bones-transport = { path = "api-bones-transport" }
mockito = "1.7.2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "time", "test-util"] }
opentelemetry_sdk = { version = "0.32", features = ["trace", "rt-tokio"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
# The in-process HTTP/2 peer of the transport replay test refuses streams.
h2 = "0.4"

